name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main repo
      uses: actions/checkout@v3
      with:
        path: repo

    - name: Checkout shared-assets
      uses: actions/checkout@v3
      with:
        repository: studio2201/shared-assets
        path: shared-assets

    - name: Check line limits
      run: |
        cd repo
        for file in $(find src -name "*.rs" 2>/dev/null || true); do
          if [ $(wc -l < "$file") -gt 256 ]; then
            echo "File $file exceeds 256 lines"
            exit 1
          fi
        done

    - name: Build RedHat Container
      run: |
        # Rename the checkout directory to match the repository name so Containerfile COPY context works
        REPO_NAME="${{ github.event.repository.name }}"
        mv repo "$REPO_NAME"
        
        # Build the container from the multi-repo root context
        podman build -t "studio2201/$REPO_NAME:latest" -f "$REPO_NAME/Containerfile" .
