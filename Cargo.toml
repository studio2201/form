[package]
name = "form"
version = "0.2.0"
edition = "2024"

[dependencies]
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
shared-backend = { path = "../shared-assets/shared-rust/shared-backend", optional = true }
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rsa = "0.9"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend" }
yew = { version = "0.23", features = ["csr"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "=0.3.98", features = ["HtmlInputElement", "Event", "Window"] }
rand = { version = "0.8" }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
shared-backend = { path = "../shared-assets/shared-rust/shared-backend" }
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { version = "0.8" }
